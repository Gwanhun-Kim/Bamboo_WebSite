<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BAMBOO UI Preview</title>
    <style>
      :root {
        --paper: #f8f7f3;
        --white: #ffffff;
        --ink: #171918;
        --muted: #686e68;
        --line: #deded7;
        --green: #0f4d36;
        --green-2: #1e6b4c;
        --soft: #eef3ed;
        --shadow: 0 20px 60px rgba(16, 24, 20, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        letter-spacing: 0;
      }

      button, input, select {
        font: inherit;
      }

      .frame {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--paper);
      }

      .desktop {
        padding: 28px 48px 42px;
      }

      .mobile {
        width: 390px;
        height: 844px;
        padding: 14px 16px 88px;
        background: #fbfaf7;
        overflow: hidden;
      }

      .nav {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(23, 25, 24, 0.09);
      }

      .logo {
        font-weight: 800;
        font-size: 24px;
        letter-spacing: 2px;
      }

      .desktop .logo {
        font-size: 28px;
      }

      .tabs {
        display: flex;
        gap: 26px;
        align-items: center;
        color: #333833;
        font-size: 15px;
      }

      .tab.active {
        color: var(--green);
        font-weight: 700;
      }

      .hamburger {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        place-items: center;
      }

      .hamburger span,
      .hamburger span::before,
      .hamburger span::after {
        display: block;
        width: 15px;
        height: 2px;
        background: var(--ink);
        content: "";
      }

      .hamburger span::before { transform: translateY(-6px); }
      .hamburger span::after { transform: translateY(4px); }

      .btn {
        border: 0;
        border-radius: 8px;
        background: var(--green);
        color: #fff;
        padding: 13px 18px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn.secondary {
        background: var(--white);
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .chip, .filter-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 13px;
        background: var(--white);
        font-size: 14px;
        white-space: nowrap;
      }

      .chip.active, .filter-chip.active {
        background: var(--green);
        color: var(--white);
        border-color: var(--green);
      }

      h1, h2, h3, p {
        margin: 0;
      }

      h1 {
        font-size: 56px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .mobile h1 {
        font-size: 31px;
        line-height: 1.14;
      }

      .eyebrow {
        color: var(--green);
        font-weight: 800;
        font-size: 14px;
        margin-bottom: 14px;
      }

      .lead {
        color: #4d524e;
        font-size: 19px;
        line-height: 1.65;
      }

      .mobile .lead {
        font-size: 15px;
        line-height: 1.6;
      }

      .card {
        background: var(--white);
        border: 1px solid rgba(23, 25, 24, 0.1);
        border-radius: 8px;
        box-shadow: 0 12px 34px rgba(15, 24, 18, 0.05);
      }

      .photo {
        position: relative;
        overflow: hidden;
        background-size: cover;
        background-position: center;
        isolation: isolate;
      }

      .photo::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.88;
        background:
          radial-gradient(circle at 26% 32%, rgba(255,255,255,0.42), transparent 13%),
          radial-gradient(circle at 68% 26%, rgba(255,255,255,0.25), transparent 16%),
          linear-gradient(125deg, rgba(10,22,19,0.05), rgba(10,22,19,0.38));
      }

      .photo::after {
        content: "";
        position: absolute;
        inset: auto 12px 12px 12px;
        height: 28%;
        border-radius: 8px;
        background: linear-gradient(90deg, rgba(255,255,255,0.26), transparent);
        mix-blend-mode: screen;
        opacity: 0.5;
      }

      .p1 { background-image: linear-gradient(135deg, #15231d, #4a6f61 36%, #e1d7c6 37%, #7a806e 58%, #1d2d29); }
      .p2 { background-image: linear-gradient(160deg, #0e1514, #2d513e 34%, #c9c0aa 35%, #ede3d1 52%, #24332f); }
      .p3 { background-image: linear-gradient(140deg, #24362e, #6a7f6d 38%, #d7d2c0 39%, #222b28 65%, #111716); }
      .p4 { background-image: linear-gradient(120deg, #151817, #343b36 28%, #eee8dc 29%, #c4b89d 47%, #203d32 72%, #0f1412); }
      .p5 { background-image: linear-gradient(150deg, #1c2623, #8d9480 33%, #f0eadc 34%, #586655 62%, #111615); }
      .p6 { background-image: linear-gradient(130deg, #0d1614, #405e51 24%, #d6d0bf 25%, #a99d86 57%, #17221f); }
      .p7 { background-image: linear-gradient(148deg, #151d1b, #64776b 30%, #e8dfcf 31%, #233d35 72%, #101413); }
      .p8 { background-image: linear-gradient(122deg, #18201e, #b7ab91 23%, #efe9db 24%, #536357 49%, #14231f); }

      .photo-label {
        position: absolute;
        left: 18px;
        bottom: 16px;
        z-index: 2;
        color: #fff;
        text-shadow: 0 1px 18px rgba(0,0,0,0.42);
      }

      .photo-label strong {
        display: block;
        font-size: 18px;
      }

      .photo-label span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.86;
      }

      .hero {
        display: grid;
        grid-template-columns: 0.96fr 1.18fr;
        gap: 34px;
        padding-top: 34px;
        height: 438px;
      }

      .hero-copy {
        padding: 38px 0 0;
      }

      .hero-actions {
        display: flex;
        gap: 12px;
        margin-top: 32px;
      }

      .hero-photo {
        min-height: 400px;
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .section-title {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin: 30px 0 16px;
      }

      .section-title h2 {
        font-size: 24px;
      }

      .quick-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 13px;
        margin-top: 20px;
      }

      .quick-card {
        min-height: 100px;
        padding: 18px;
      }

      .quick-card b {
        display: block;
        font-size: 18px;
        margin-bottom: 10px;
      }

      .quick-card span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .exhibition-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .exhibition-strip .photo {
        height: 178px;
        border-radius: 8px;
      }

      .mobile-hero-photo {
        height: 286px;
        border-radius: 8px;
        margin-top: 18px;
      }

      .mobile-section {
        margin-top: 22px;
      }

      .mobile-stack {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .mobile-card {
        border-radius: 8px;
        padding: 15px;
        min-height: 72px;
      }

      .mobile-card b {
        font-size: 16px;
      }

      .mobile-card p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-top: 6px;
      }

      .page-grid {
        display: grid;
        grid-template-columns: 0.94fr 1.06fr;
        gap: 34px;
        padding-top: 38px;
      }

      .intro-copy {
        padding-top: 16px;
      }

      .activity-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 30px;
      }

      .activity-card {
        padding: 20px;
        min-height: 138px;
      }

      .icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--green);
        display: grid;
        place-items: center;
        font-weight: 900;
        margin-bottom: 14px;
      }

      .activity-card b {
        font-size: 18px;
      }

      .activity-card p {
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.5;
        font-size: 14px;
      }

      .collage {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 14px;
        height: 440px;
      }

      .collage .photo {
        border-radius: 8px;
      }

      .collage-side {
        display: grid;
        gap: 14px;
      }

      .timeline {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-top: 28px;
      }

      .timeline .card {
        padding: 17px;
      }

      .timeline small {
        color: var(--green);
        font-weight: 800;
      }

      .timeline b {
        display: block;
        margin-top: 8px;
      }

      .timeline p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 7px;
      }

      .mobile-top-photo {
        height: 188px;
        border-radius: 8px;
        margin-top: 14px;
      }

      .icon-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .icon-row {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 12px;
        align-items: center;
        padding: 13px;
      }

      .archive-layout {
        display: grid;
        grid-template-columns: 1fr 362px;
        gap: 24px;
        margin-top: 26px;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 26px;
      }

      .search {
        flex: 1;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        height: 42px;
        padding: 0 14px;
        color: #60665f;
      }

      .exhibit-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      .exhibit-card {
        display: grid;
        grid-template-columns: 154px 1fr;
        min-height: 174px;
        overflow: hidden;
      }

      .exhibit-card .photo {
        height: 100%;
      }

      .exhibit-copy {
        padding: 17px;
      }

      .exhibit-copy h3 {
        font-size: 18px;
      }

      .exhibit-copy p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-top: 8px;
      }

      .tiny-btn {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        font-weight: 800;
        font-size: 13px;
      }

      .preview-panel {
        padding: 18px;
      }

      .preview-panel .photo {
        height: 330px;
        border-radius: 8px;
        margin-bottom: 18px;
      }

      .preview-panel p {
        color: var(--muted);
        line-height: 1.55;
        margin-top: 10px;
      }

      .select-row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        overflow: hidden;
      }

      .mobile-select {
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 0 12px;
        min-width: 128px;
      }

      .mobile-exhibits {
        display: grid;
        gap: 13px;
        margin-top: 16px;
      }

      .mobile-exhibit-card {
        overflow: hidden;
      }

      .mobile-exhibit-card .photo {
        height: 138px;
      }

      .mobile-exhibit-card .exhibit-copy {
        padding: 14px;
      }

      .gallery-layout {
        display: grid;
        grid-template-columns: 196px 1fr 328px;
        gap: 20px;
        margin-top: 28px;
      }

      .side-filter {
        padding: 18px;
        align-self: start;
      }

      .side-filter h3 {
        font-size: 16px;
        margin: 18px 0 10px;
      }

      .side-filter h3:first-child {
        margin-top: 0;
      }

      .filter-list {
        display: grid;
        gap: 8px;
      }

      .masonry {
        columns: 3;
        column-gap: 14px;
      }

      .masonry-item {
        break-inside: avoid;
        margin-bottom: 14px;
      }

      .masonry-item .photo {
        border-radius: 8px;
      }

      .masonry-item:nth-child(1) .photo { height: 210px; }
      .masonry-item:nth-child(2) .photo { height: 285px; }
      .masonry-item:nth-child(3) .photo { height: 185px; }
      .masonry-item:nth-child(4) .photo { height: 248px; }
      .masonry-item:nth-child(5) .photo { height: 220px; }
      .masonry-item:nth-child(6) .photo { height: 300px; }
      .masonry-item small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 7px;
      }

      .lightbox {
        padding: 16px;
      }

      .lightbox .photo {
        height: 392px;
        border-radius: 8px;
      }

      .lightbox h3 {
        margin-top: 15px;
        font-size: 20px;
      }

      .lightbox p {
        color: var(--muted);
        line-height: 1.5;
        margin-top: 9px;
        font-size: 14px;
      }

      .mobile-chips {
        display: flex;
        gap: 8px;
        margin: 16px -16px 0 0;
        overflow: hidden;
      }

      .two-col-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 15px;
      }

      .two-col-grid .photo {
        height: 146px;
        border-radius: 8px;
      }

      .bottom-sheet {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 16px;
        padding: 14px;
        border-radius: 8px;
        background: rgba(255,255,255,0.96);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .bottom-sheet .photo {
        height: 122px;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      .recruit-layout {
        display: grid;
        grid-template-columns: 1fr 428px;
        gap: 32px;
        padding-top: 30px;
      }

      .recruit-blocks {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 26px;
      }

      .info-block {
        padding: 18px;
      }

      .info-block b {
        display: block;
        margin-bottom: 8px;
        font-size: 17px;
      }

      .info-block p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .recruit-photo {
        height: 546px;
        border-radius: 8px;
      }

      .faq {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .faq .card {
        padding: 15px 17px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .fixed-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }

      .accordion {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .accordion .card {
        padding: 15px;
      }

      .accordion .open p {
        display: block;
      }

      .accordion p {
        color: var(--muted);
        display: none;
        font-size: 13px;
        line-height: 1.5;
        margin-top: 8px;
      }

      .mobile-bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px 16px;
        background: rgba(251,250,247,0.94);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .contact-layout {
        display: grid;
        grid-template-columns: 1fr 0.95fr;
        gap: 28px;
        margin-top: 30px;
      }

      .contact-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .contact-card {
        padding: 22px;
        min-height: 168px;
      }

      .contact-card h3 {
        font-size: 19px;
        margin-bottom: 10px;
      }

      .contact-card p {
        color: var(--muted);
        line-height: 1.5;
        font-size: 14px;
      }

      .map-card {
        padding: 18px;
      }

      .map {
        height: 342px;
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(15,77,54,0.13) 1px, transparent 1px),
          linear-gradient(rgba(15,77,54,0.13) 1px, transparent 1px),
          linear-gradient(135deg, #f0efe8, #dfe8de);
        background-size: 42px 42px, 42px 42px, cover;
        position: relative;
        overflow: hidden;
      }

      .map::before {
        content: "세종대학교";
        position: absolute;
        left: 44%;
        top: 39%;
        padding: 11px 15px;
        border-radius: 8px;
        background: var(--green);
        color: #fff;
        font-weight: 800;
      }

      .contact-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }

      .mobile-contact-stack {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .mobile-contact-card {
        padding: 17px;
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 12px;
        align-items: start;
      }

      .mobile-contact-card .btn {
        margin-top: 10px;
        padding: 9px 12px;
        font-size: 13px;
      }

      .staff-note {
        margin-top: 18px;
        padding: 16px;
        color: var(--muted);
        line-height: 1.55;
        font-size: 13px;
      }

      .mobile .nav {
        height: 46px;
      }

      .mobile .logo {
        font-size: 20px;
      }

      .mobile-page-title {
        margin-top: 20px;
      }

      .mobile-page-title h1 {
        margin-bottom: 9px;
      }

      .screen {
        position: relative;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main id="app" class="frame"></main>
    <script>
      const tabs = ["동아리 소개", "사진전", "활동 사진", "신입부원 모집", "연락처"];
      const quick = [
        ["동아리 소개", "밤부가 기록하는 방식과 활동을 소개합니다."],
        ["사진전 다시보기", "온라인과 오프라인 전시 아카이브를 확인하세요."],
        ["활동 사진", "출사, MT, 소모임의 순간을 모았습니다."],
        ["신입부원 모집", "사진을 좋아하는 모든 세종인을 기다립니다."],
        ["연락처", "인스타그램, 이메일, 오픈채팅 문의"]
      ];
      const exhibits = [
        ["여름의 잔상", "2026.06.18 - 06.24", "방학 전 마지막 빛과 색을 모은 온라인 사진전", "p1"],
        ["낯선 시선", "2025.11.03 - 11.09", "거리와 캠퍼스에서 발견한 새로운 장면들", "p2"],
        ["필름처럼", "2025.05.20 - 05.26", "아날로그 감성으로 기록한 봄 학기 전시", "p3"],
        ["밤의 대화", "2024.12.02 - 12.08", "야간 출사와 장노출 사진을 중심으로 구성", "p4"]
      ];
      const activities = [
        ["정기 출사", "월 1회 서울 곳곳에서 함께 촬영합니다.", "01"],
        ["사진 콘테스트", "1학기, 여름방학, 2학기, 겨울방학 연 4회 진행합니다.", "02"],
        ["사진전", "온라인 전시와 오프라인 전시로 작품을 공유합니다.", "03"],
        ["소모임 활동", "필름, 보정, 야경, 인물 등 다양한 관심사를 나눕니다.", "04"]
      ];
      const gallery = [
        ["p1", "정기 출사", "2026.05.18"],
        ["p2", "전시 준비", "2026.04.29"],
        ["p3", "소모임", "2026.04.12"],
        ["p4", "개강총회", "2026.03.08"],
        ["p5", "사진 콘테스트", "2025.12.21"],
        ["p6", "MT", "2025.09.14"]
      ];

      function nav(active, mobile = false) {
        return `
          <header class="nav">
            <div class="logo">BAMBOO</div>
            ${mobile ? `<div class="hamburger"><span></span></div>` : `<nav class="tabs">${tabs.map(t => `<span class="tab ${t === active ? "active" : ""}">${t}</span>`).join("")}</nav>`}
          </header>
        `;
      }

      function photo(cls, label = "", sub = "") {
        return `<div class="photo ${cls}">${label ? `<div class="photo-label"><strong>${label}</strong><span>${sub}</span></div>` : ""}</div>`;
      }

      function homeDesktop() {
        return `
          <div class="desktop screen">
